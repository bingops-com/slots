{{- with .Values.database.cnpg }}
{{- if .enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "slots.postgresql" $ }}
  labels:
    {{- include "slots.labels" $ | nindent 4 }}
spec:
  instances: {{ .instances }}
  bootstrap:
    initdb:
      database: slots
      owner: slots
      dataChecksums: true
  storage:
    size: {{ .storage.size }}
    {{- if .storage.storageClass }}
    storageClass: {{ .storage.storageClass }}
    {{- end }}
  {{- if .backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .backup.objectStore }}
        # À incrémenter après un nouvel initdb : Barman refuse d'archiver dans le
        # dossier d'une autre incarnation de la base.
        serverName: {{ .backup.serverName }}
  {{- end }}
{{- if .backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "slots.postgresql" $ }}-daily
  labels:
    {{- include "slots.labels" $ | nindent 4 }}
spec:
  schedule: {{ .backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "slots.postgresql" $ }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- if .podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "slots.postgresql" $ }}
  labels:
    {{- include "slots.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "slots.postgresql" $ }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- end }}
{{- end }}
